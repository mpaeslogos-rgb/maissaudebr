name: Cypress E2E

# Só disparo manual: os secrets CYPRESS_API_URL/CYPRESS_BASE_URL apontam para
# PRODUÇÃO e cada execução grava pacientes, consultas e pagamentos reais.
# Voltar a rodar em push/pull_request só depois de existir um ambiente de teste.
on:
  workflow_dispatch:

jobs:
  cypress:
    name: Cypress Cloud Record
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      CYPRESS_ADMIN_EMAIL: ${{ secrets.CYPRESS_ADMIN_EMAIL }}
      CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD }}
      CYPRESS_API_URL: ${{ secrets.CYPRESS_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Run Cypress Cloud tests
        run: npx cypress run --record --key $CYPRESS_RECORD_KEY
        env:
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}
